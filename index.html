<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern</title>
</head>
<body>
    <div id="pattern">JS (javascript sprinkles)</div>
    <div class="controls">

    <label>
        SIZE
        <input
            type="range"
            id="sizeSlider"
            min="0.5"
            max="3"
            step="0.1"
            value="1"
        >
    </label>

    <label>
        VARIATION
        <input
            type="range"
            id="variationSlider"
            min="0"
            max="2"
            step="0.1"
            value="0"
        >
    </label>

</div>

<div id="pattern"></div>

<script src="script.js"></script>
    <script src="script.js"></script>
</body>
</html>
